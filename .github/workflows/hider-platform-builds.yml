name: HiderTHBROWser Windows and Linux Builds

on:
  push:
    branches:
      - hiderthbrowser-local
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hider-platform-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows 10/11 x64 NSIS installer
            runner: windows-latest
            bundles: nsis
            artifact: HiderTHBROWser-Windows-x64
          - label: Linux x64 DEB, RPM, and AppImage
            runner: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: HiderTHBROWser-Linux-x64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      BUILD_TAG: hider-local-${{ github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config libssl-dev unzip xdg-utils rpm libfuse2 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev

      - name: Restore Rust dependency cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting and types
        if: runner.os == 'Linux'
        run: pnpm lint:js

      - name: Run saved launch set unit tests
        if: runner.os == 'Linux'
        run: pnpm test:launch-sets

      - name: Check frontend types on Windows
        if: runner.os == 'Windows'
        run: pnpm exec tsrs --noEmit

      - name: Check Linux AppStream metadata
        if: runner.os == 'Linux'
        run: pnpm test:appimage-metainfo

      - name: Build HiderTHBROWser
        env:
          NEXT_PUBLIC_TURNSTILE: ${{ secrets.NEXT_PUBLIC_TURNSTILE }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Collect Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          if ($files.Count -lt 1) { throw "No Windows NSIS installer was produced." }
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $files | Copy-Item -Destination "artifacts"

      - name: Collect Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -exec cp {} artifacts/ \;
          find src-tauri/target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm' -exec cp {} artifacts/ \;
          find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -iname '*.AppImage' -exec cp {} artifacts/ \;
          for extension in deb rpm AppImage; do
            count=$(find artifacts -maxdepth 1 -type f -iname "*.$extension" | wc -l)
            if [ "$count" -lt 1 ]; then
              echo "Expected at least one .$extension package, found $count"
              exit 1
            fi
          done
          ls -lh artifacts

      - name: Upload platform installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
